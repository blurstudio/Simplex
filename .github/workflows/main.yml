
name: build

on:
  push:
    tags:
      - v*
  pull_request:
    branches: [ master ]

jobs:
  compile_plugin:
    strategy:
      matrix:
        maya: [2023, 2024, 2025, 2026, 2027]
        os: [macos-13, macos-latest, ubuntu-latest, windows-latest]
        include: 
          # Add the maya update versions here
          - maya: 2023
            update: 3
          - maya: 2024
            update: 2
          - maya: 2025
            update: 3
          - maya: 2026
            update: 2
          - maya: 2027
            update: 2

        # cross-compiling is annoying so just fall back to macos-13
        exclude: 
          - os: macos-latest
            maya: 2023
          - os: macos-13
            maya: 2023
          - os: macos-13
            maya: 2024
          - os: macos-13
            maya: 2025
          - os: macos-13
            maya: 2026
          - os: macos-13
            maya: 2027

      fail-fast: false

    runs-on: ${{ matrix.os }}
    steps:
      - name: 'Checkout repo'
        uses: actions/checkout@v7

      - name: 'ACTUALLY get tags'
        run: git fetch --force --tag

      - name: Get Maya Devkit
        id: get-devkit
        uses: blurstudio/mayaModuleActions/getMayaDevkit@v1
        with:
          maya: ${{ matrix.maya }}
          update: ${{ matrix.update }}

      - name: Build Maya
        uses: blurstudio/mayaModuleActions/mesonBuild@v1
        with:
          meson-version: 1.9.0
          setup-args: >
            -Dmaya:maya_version=${{ matrix.maya }}
            -Dmaya:maya_devkit_base=${{ steps.get-devkit.outputs.devkit-path }}
            -Dmaya_build=true
            -Dpython_build=false
            --buildtype release
            --backend ninja
          install-args: --skip-subprojects

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-${{ matrix.maya }}-plugin
          path: output_Maya${{ matrix.maya }}/*.${{ steps.get-devkit.outputs.plugin-ext }}
          if-no-files-found: error

  compile_python:
    strategy:
      matrix:
        # Sorry x86 MacOS, The switch to ARM is maiking this too complicated
        # Maya modules don't detect the architecture of the OS, so I've gotta pick 
        include:
          - os: macos-latest
            plat-tag: macosx_12_0_arm64
            cibw-build: cp39-macosx_arm64
          - os: ubuntu-latest
            plat-tag: manylinux_2_28_x86_64
            cibw-build: cp39-manylinux_x86_64
          - os: windows-latest
            plat-tag: win_amd64
            cibw-build: cp39-win_amd64

      fail-fast: false

    runs-on: ${{ matrix.os }}
    steps:
      - name: 'Checkout repo'
        uses: actions/checkout@v7

      - name: 'ACTUALLY get tags'
        run: git fetch --force --tags origin

      - name: 'Get Previous tag'
        id: previoustag
        uses: "WyriHaximus/github-action-get-previous-tag@v2"
        with:
          fallback: v0.0.1

      - name: 'Write version.txt'
        run: echo "${{ steps.previoustag.outputs.tag }}" > version.txt

      - name: Build Wheel
        uses: pypa/cibuildwheel@v4.3
        with:
          output-dir: dist
        env:
          CIBW_BUILD: ${{ matrix.cibw-build }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          # Makes the macOS binary's min OS match the macosx_12_0 tag
          MACOSX_DEPLOYMENT_TARGET: '12.0'

      # cibuildwheel brings its own cp39 for the build, this python is just for the retag and extract steps
      - name: Get python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Retag Wheel
        shell: bash
        run: |
          python -m pip install -U wheel
          for PY_WHEEL in dist/*.whl
          do
          python -m wheel tags --remove --python-tag cp39 --abi-tag abi3 --platform-tag ${{ matrix.plat-tag }} ${PY_WHEEL}
          done

      - name: Extract Compiled Module Files From Wheel
        shell: bash
        run: |
          mkdir -p wheel_extract pyModule
          for PY_WHEEL in dist/*.whl
          do
          python -m zipfile -e "${PY_WHEEL}" wheel_extract/
          done
          find wheel_extract -type f \( -name '*.pyd' -o -name '*.so' \) -exec cp {} pyModule/ \;

      - name: Upload Wheel Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-wheels
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload Module Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-pyModule
          path: pyModule
          if-no-files-found: error

  upload_release:
    name: Upload release
    needs: [compile_plugin, compile_python]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: 'ACTUALLY get tags'
        run: git fetch --force --tags origin

      - name: Get Previous tag
        id: previoustag
        uses: "WyriHaximus/github-action-get-previous-tag@v2"
        with:
          fallback: v0.0.1

      - name: Build the module scripts folder
        uses: blurstudio/mayaModuleActions/mesonBuild@v1
        with:
          meson-version: 1.9.0
          setup-args: >
            -Dmaya_build=false
            -Dpython_build=true
            -Dpython_script_build=true
          install-args: --skip-subprojects

      - name: Package
        uses: blurstudio/mayaModuleActions/packageMayaModule@v1
        with: 
          module-name: simplex
          folder-list: scripts icons
          version: ${{ steps.previoustag.outputs.tag }}
          py-limited-api: true

      - name: Upload distribution
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v1
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          files: |
            *.zip

      - name: Publish To PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          shopt -s globstar
          cp artifacts/**/*.whl .
          python3 -m pip install -U pip
          python3 -m pip install -U twine
          python3 -m twine upload --verbose *.whl
